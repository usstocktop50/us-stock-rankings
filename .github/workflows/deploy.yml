name: Snapshot & Deploy

on:
  # 備援排程（主要準點觸發由外部 cron-job.org 於 UTC 00:30 打 workflow_dispatch）。
  # GitHub 排程會飄移甚至漏跑，故設兩道備援；重複執行有 sameDay 守衛、無害。
  # 非整點分鐘可避開 GitHub 整點壅塞被丟棄的問題。週二至週六＝美股週一至週五收盤資料。
  schedule:
    - cron: "40 0 * * 2-6" # UTC 00:40 ≈ 台灣 08:40（早班；此時 Polygon 免費源多半還是前一個交易日）
    - cron: "17 2 * * 2-6" # UTC 02:17 ≈ 台灣 10:17（第二道備援）
    # 重點班：Polygon 免費源要等「美東換日」(約 UTC 04:00–05:00) 後才放出前一晚收盤，
    # 故排在 UTC 05:00（≈ 台灣 13:00）抓最新交易日；搭配 snapshot 的自檢重試最遲約 14:20 拿到。
    - cron: "0 5 * * 2-6" # UTC 05:00 ≈ 台灣 13:00（最新交易日資料的主要更新班）
  # 推送到主分支時也重新部署（程式變更）
  push:
    branches: [main]
  # 允許在 Actions 頁面手動觸發
  workflow_dispatch:

permissions:
  contents: write # 需可寫回 repo（commit 歷史快照）
  pages: write
  id-token: write

# 同時間只跑一個部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 跨執行保留 Polygon 明細快取（名稱/市值/產業），減少 API 呼叫
      - name: Restore ticker metadata cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: polygon-tickers-v1

      # 產生 public/rankings.json（含 AI 題材分析）。
      # 若資料來源暫時失敗（如 Polygon 5xx），不中斷部署 —— 沿用已 commit 的上一份快照。
      - name: Snapshot rankings
        run: node scripts/snapshot.mjs || echo "::warning::snapshot 失敗，改用 repo 內既有 rankings.json 部署"
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 用 Pages 自動推得的 base_path（專案站台為 /repo，使用者站台為空）
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      # GitHub 偶發「artifact 已上傳成功，但 deploy-pages 查不到 (Found 0 artifact(s))」
      # 的後端延遲（2026-11-24 起頻繁發生，與內容無關，稍等即可查到）。
      # 失敗先等 30 秒重試一次，兩次都失敗才算真的掛（才會寄失敗信）。
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # 將產生的快照與歷史寫回 repo，讓歷史能跨每日累積（否則下次 build 會缺舊歷史）。
      # [skip ci] 避免此 commit 再次觸發部署而形成迴圈。
      # 即使部署失敗也要寫回（!cancelled()），否則當天快照/歷史會遺失。
      - name: Commit snapshot + history back to repo
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/rankings.json public/history
          if git diff --staged --quiet; then
            echo "資料無變更，略過 commit。"
          else
            git commit -m "chore(data): 更新排行快照與歷史 [skip ci]"
            git push
          fi
